name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    name: build · check · render
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build plugin artifacts
        run: npm run build
      - name: Committed artifacts are current
        run: git diff --exit-code -- lib
      - name: Artifact and parser checks
        run: npm run check
      - name: Server-rendered panel and LOOP checks
        run: npm run check:render
